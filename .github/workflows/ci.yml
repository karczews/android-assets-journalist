name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  conventional-commits:
    name: Check Conventional Commits
    runs-on: ubuntu-26.04
    steps:
      - name: Check for Conventional Commit compliance
        uses: tomtom-international/commisery-action@v8
        with:
          token: ${{ github.token }}

  license-header:
    name: Check License Headers
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Check License Headers
        uses: apache/skywalking-eyes/header@v0.9.0
        with:
          mode: check
          config: .licenserc.yaml

  build:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17.0.21+9'
        distribution: 'temurin'
    
    - name: Setup Android CLI
      # Pinned so CLI upgrades happen through reviewed changes, not silently via `latest`.
      env:
        ANDROID_CLI_VERSION: 1.0.16500706
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL "https://dl.google.com/android/cli/${ANDROID_CLI_VERSION}/linux_x86_64/android" -o "$HOME/.local/bin/android"
        chmod +x "$HOME/.local/bin/android"
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Setup Android SDK
      run: android sdk install platforms/android-35 build-tools/35.0.0
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Set version from commit SHA
      id: version
      run: |
        VERSION="1.0.0-SNAPSHOT-${{ github.sha }}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Using version: $VERSION"

    - name: Build with Gradle
      run: ./gradlew clean build test check jacocoTestReport publishToMavenLocal -Pversion=${{ steps.version.outputs.VERSION }}
    
    - name: Build Playground
      run: |
        chmod +x .scripts/build_playground.sh
        ./.scripts/build_playground.sh ${{ steps.version.outputs.VERSION }}
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./build/reports/jacoco/test/jacocoTestReport.xml
        fail_ci_if_error: true
        verbose: true # optional (default = false)
